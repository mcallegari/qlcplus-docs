name: spellcheck
on:
  push:
  pull_request:
jobs:
  check-spelling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check Spelling
        uses: rojopolis/spellcheck-github-actions@0.68.0
        with:
          config_path: .spellcheck.yml
          task_name: Markdown

# PDFs are built by release.yml when a tag is pushed
# (or by running it manually from the Actions tab for a test build).
