name: Release

# Pushing a tag builds the PDFs of the matching version, one per language,
# and attaches them to the GitHub release of that tag:
#   4.14.4 -> v4 (en, ca, de...)    5.1.0 -> v5 (en, ca, de, es, fr, it...)
# Languages come from the files in pages/, so new translations are picked up automatically.
on:
  push:
    tags:
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      ref:
        description: Tag (or branch, for a test build) to build, e.g. 5.1.0
        required: true
        type: string
      version:
        description: Documentation version ("auto" reads it from the tag)
        type: choice
        options: [auto, v4, v5]
        default: auto
      publish:
        description: Attach the PDFs to the release (otherwise they're only kept as workflow artifacts)
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.ref || github.ref_name }}

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.setup.outputs.ref }}
      sha: ${{ steps.setup.outputs.sha }}
      version: ${{ steps.setup.outputs.version }}
      langs: ${{ steps.setup.outputs.langs }}
      release: ${{ steps.setup.outputs.release }}
      publish: ${{ steps.setup.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - id: setup
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          VERSION: ${{ inputs.version || 'auto' }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if [[ "$VERSION" == auto ]]; then
            if [[ "$REF" =~ ^([0-9]+)\. ]]; then
              VERSION="v${BASH_REMATCH[1]}"
            else
              echo "::error::Can't tell the documentation version from '$REF'. Pick v4 or v5."
              exit 1
            fi
          fi

          langs=$(python3 scripts/merge_docs.py --list-langs "$VERSION")
          if [[ "$langs" == "[]" ]]; then
            echo "::error::No $VERSION pages found."
            exit 1
          fi

          is_tag=false
          git ls-remote --exit-code --tags origin "refs/tags/$REF" >/dev/null && is_tag=true
          if [[ "$PUBLISH" == true && "$is_tag" != true ]]; then
            echo "::error::'$REF' is not a tag: only tags can be published."
            exit 1
          fi
          release="$REF"
          [[ "$is_tag" == true ]] || release="$REF ($(git rev-parse --short HEAD))"

          {
            echo "ref=$REF"
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$VERSION"
            echo "langs=$langs"
            echo "release=$release"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "Building **$VERSION** PDFs for **$release**: $langs" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ needs.setup.outputs.version }}-${{ matrix.lang }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.setup.outputs.langs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - id: build
        uses: ./.github/actions/build-pdf
        with:
          version: ${{ needs.setup.outputs.version }}
          lang: ${{ matrix.lang }}
          release: ${{ needs.setup.outputs.release }}

      - uses: actions/upload-artifact@v7
        with:
          name: qlcplus-docs-${{ needs.setup.outputs.version }}-${{ matrix.lang }}
          path: ${{ steps.build.outputs.pdf_path }}
          if-no-files-found: error

  publish:
    needs: [setup, build]
    if: needs.setup.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pdfs
          pattern: qlcplus-docs-*
          merge-multiple: true

      - name: Attach PDFs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.setup.outputs.ref }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Mark it "latest" only if it's the highest version,
            # so a 4.x fix released after 5.x doesn't take over.
            highest=$( { echo "$TAG"; gh release list --limit 100 --json tagName --jq '.[].tagName'; } | sort -V | tail -n 1)
            latest=false
            [[ "$highest" == "$TAG" ]] && latest=true
            gh release create "$TAG" --verify-tag --title "QLC+ $TAG" \
              --notes "Documentation PDFs for QLC+ $TAG." --latest="$latest"
          fi
          gh release upload "$TAG" pdfs/*.pdf --clobber
