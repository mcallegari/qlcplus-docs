name: Build PDF
description: Build the PDF of one documentation flavour (version + language)

inputs:
  version:
    description: Documentation version, e.g. v5
    required: true
  lang:
    description: Language code, e.g. it
    required: false
    default: en
  release:
    description: Release number shown on the title page
    required: false
    default: ""

outputs:
  pdf_path:
    description: Path to the resulting PDF
    value: ${{ steps.build.outputs.pdf }}

runs:
  using: composite
  steps:
    - name: Install image tools
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq librsvg2-bin imagemagick

    # Fonts are downloaded by build-pdf.sh; keep them between runs.
    # Change the key when the font versions in build-pdf.sh change.
    - name: Cache fonts
      uses: actions/cache@v6
      with:
        path: build/fonts
        key: pdf-fonts-inter4.1-jetbrainsmono2.304

    - id: build
      name: Build PDF
      shell: bash
      env:
        DOC_VERSION: ${{ inputs.version }}
        DOC_LANG: ${{ inputs.lang }}
        RELEASE: ${{ inputs.release }}
        PANDOC: docker
      run: |
        pdf=$(scripts/build-pdf.sh "$DOC_VERSION" "$DOC_LANG" | tail -n 1)
        echo "pdf=$pdf" >> "$GITHUB_OUTPUT"
